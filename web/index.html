  <script>
    // Suppress harmless Flutter Web engine viewport resize assertions
    window.addEventListener('unhandledrejection', function (event) {
      var reasonStr = (event && event.reason) ? String(event.reason) : '';
      if (reasonStr.indexOf('ViewInsets cannot be negative') !== -1 || reasonStr.indexOf('_viewInsets.isNonNegative') !== -1) {
        event.preventDefault();
        console.warn('Suppressed Flutter Web engine viewport assertion:', reasonStr);
      }
    });
    window.addEventListener('error', function (event) {
      var msgStr = (event && event.message) ? String(event.message) : '';
      if (msgStr.indexOf('ViewInsets cannot be negative') !== -1 || msgStr.indexOf('_viewInsets.isNonNegative') !== -1) {
        event.preventDefault();
        console.warn('Suppressed Flutter Web engine viewport assertion:', msgStr);
      }
    });
  </script>

  <!-- Razorpay Web Checkout SDK & JS Bridge -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.openRazorpayWebCheckout = function (optionsJson, successCallback, failureCallback) {
      try {
        var options = typeof optionsJson === 'string' ? JSON.parse(optionsJson) : optionsJson;
        options.handler = function (response) {
          if (successCallback) {
            successCallback(response.razorpay_payment_id || '', response.razorpay_order_id || '', response.razorpay_signature || '');
          }
        };
        options.modal = {
          ondismiss: function () {
            if (failureCallback) failureCallback('Checkout popup closed by user');
          }
        };
        var rzp = new Razorpay(options);
        rzp.on('payment.failed', function (response) {
          var msg = (response && response.error && response.error.description) ? response.error.description : 'Payment failed';
          if (failureCallback) failureCallback(msg);
        });
        rzp.open();
      } catch (e) {
        if (failureCallback) failureCallback('Error opening Razorpay checkout: ' + e);
      }
    };
  </script>
